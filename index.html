<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KoZons - Inscription Confirmée</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        background-color: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
        width: 90%;
      }
      .icon {
        font-size: 50px;
        color: #2e7d32;
        margin-bottom: 20px;
      }
      h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 10px;
      }
      p {
        color: #666;
        font-size: 16px;
        line-height: 1.6;
      }
      .brand {
        font-weight: bold;
        color: #1565c0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">✓</div>
      <h1>Inscription Validée !</h1>
      <p>Votre adresse email a été confirmée avec succès.</p>
      <p>Vous pouvez maintenant fermer cette page et vous connecter sur l'application mobile <span class="brand">KoZons</span>.</p>
    </div>
  </body>
</html>
